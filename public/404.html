<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone2Laptop – Transferts instantanés entre téléphone et ordinateur</title>
  <meta name="description" content="Échangez fichiers, photos, vidéos et texte entre smartphone et ordinateur en un seul scan. Gratuit, rapide et sécurisé.">
  <meta name="theme-color" content="#007BFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phone2Laptop">

  <!-- Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body { scroll-behavior: smooth; }
    .hero { background: #f8f9fa; }
    #file-list img { height: 40px; width: auto; }
    #shared-text { height: 240px; resize: vertical; }
    .step-icon { font-size: 2.5rem; }
  </style>
</head>

<body>

  <body>
    <div class="site-wrap">


      <main>

        <!-- ======= 404 – Page non trouvée ======= -->
        <section class="section py-5" id="not-found">
          <div class="container">
            <div class="row justify-content-center text-center">
              <div class="col-lg-8">
                <div class="mb-4">
                  <span class="badge rounded-pill bg-danger-subtle text-danger border" style="font-size:0.95rem;">
                    <i class="bi bi-exclamation-triangle me-1"></i> <span editor="txt">Erreur 404</span>
                  </span>
                </div>

                <h1 class="display-4 fw-bold mb-3" editor="txt">Page introuvable</h1>
                <p class="lead text-muted mb-4" editor="txt">
                  Désolé, la page que vous recherchez n’existe pas ou a été déplacée.
                </p>

                <div class="display-1 fw-bolder mb-4" aria-hidden="true" style="letter-spacing:0.1em;">404</div>

                <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                  <a href="/" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door me-1"></i><span editor="txt">Retour à l’accueil</span>
                  </a>
                  <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-left me-1"></i><span editor="txt">Page précédente</span>
                  </a>
                </div>

                <hr class="my-5"/>

                <form action="/search" method="get" class="row g-2 justify-content-center">
                  <div class="col-12 col-md-8">
                    <label for="q" class="visually-hidden">Recherche</label>
                    <input id="q" name="q" type="search" class="form-control form-control-lg"
                           placeholder="Rechercher un contenu…" aria-label="Rechercher"/>
                  </div>
                  <div class="col-12 col-md-auto">
                    <button type="submit" class="btn btn-dark btn-lg w-100">
                      <i class="bi bi-search me-1"></i><span editor="txt">Rechercher</span>
                    </button>
                  </div>
                </form>

                <p class="mt-4 small text-muted" editor="txt">
                  Si le problème persiste, contactez notre support ou essayez plus tard.
                </p>
              </div>
            </div>
          </div>
        </section>
        <!-- ======= /404 ======= -->

      </main>

      
      <!-- call-template:partials/footer.xml -->
    </div>
  </body>
  <!-- call-template:partials/scripts.xml -->
</html>
